name: Geometry Transition Reliability V1

on:
  push:
    branches:
      - analysis/geometry-transition-reliability-v1-20260929
    paths:
      - ".github/workflows/geometry-transition-reliability-v1.yml"
      - "scripts/42_geometry_transition_reliability_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/geometry-transition-reliability-v1-20260929
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run geometry transition reliability diagnostic
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/42_geometry_transition_reliability_v1.py 2>&1 | tee geometry_transition_v1.log
      - name: Package outputs
        if: always()
        run: |
          mkdir -p action_artifact
          cp geometry_transition_v1.log action_artifact/ || true
          if [ -d outputs/geometry_transition_reliability_v1 ]; then
            cp -a outputs/geometry_transition_reliability_v1 action_artifact/
          fi
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          p=Path("action_artifact/runtime.json")
          p.write_text(json.dumps({
              "python":sys.version,
              "platform":platform.platform(),
              "github_sha":os.environ.get("GITHUB_SHA"),
              "github_ref":os.environ.get("GITHUB_REF"),
          },indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-transition-reliability-v1
          path: action_artifact/
          if-no-files-found: error
          retention-days: 7
