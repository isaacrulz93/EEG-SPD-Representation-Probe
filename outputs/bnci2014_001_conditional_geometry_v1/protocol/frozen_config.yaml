  unlock_filename: outputs/bnci2014_001_conditional_geometry_v1/confirmatory_unlock.json

geometry:
  primary: AIRM
  secondary: LE
  class_order: [left_hand, right_hand, feet, tongue]
  d_upper_triangle_indices: [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]]
  g_svec_off_diagonal_scale: sqrt2
  mean_riemann:
    implementation: pyriemann.geometry.mean.mean_riemann
    tol: 1.0e-9
    maxiter: 100
    init: null
    independent_residual: true
  mean_logeuclid:
    implementation: pyriemann.geometry.mean.mean_logeuclid
    custom_closed_form_crosscheck: true
  shape_degeneracy:
    epsilon_multiplier: 100.0
  permutation_rank_tolerance: 1.0e-12
  permutation_order: python_lexicographic
  template_aggregation: normalize_sum_of_unit_subject_shapes

hard_gates:
  finite_nonfinite_count_max: 0
  symmetry_relative_error_max: 1.0e-12
  min_eigenvalue_strictly_greater_than: 0.0
  condition_number_max: 1.0e12
  airm_karcher_residual_max: 1.0e-7
  d_centering_relative_error_max: 1.0e-10
  g_direct_whitened_relative_error_max: 1.0e-10
  orthogonal_d_relative_error_max: 1.0e-10
  orthogonal_g_relative_error_max: 1.0e-10
  permutation_equivariance_relative_error_max: 1.0e-10
  le_mean_relative_error_max: 1.0e-10
  le_d_g_identity_relative_error_max: 1.0e-10
  all_required_rows_must_pass: true

rng:
  bit_generator: PCG64DXSM
  seed_sequence_fields: [master_seed, family_tag, phase_tag, replicate_index]
  replicate_index_base: 0
  family_tags:
    label_destruction: 1101
    semantic_permutation: 1201
    oracle_rank: 1301
    subject_bootstrap: 1401
    orthogonal_gauge: 1501
  phase_tags:
    discovery: 0
    confirmatory: 1
    paired_common: 2
  canonical_draw_order: [subject, run]

nulls:
  label_destruction:
    replicates: 1999
    permutation_unit: subject_session_run
    preserve_label_multiset: true
    same_plan_airm_le: true
    batch_size: 8
    checkpoint_every: 25
  semantic_permutation:
    replicates: 100000
    permutation_pool: all_24_S4_including_identity
    independent_by_source_subject: true
    same_subject_permutation_across_splits_geometries_objects: true
    same_plan_discovery_confirmatory: true
    batch_size: 5000
    checkpoint_every_batches: 1
  oracle_rank:
    replicates: 1000000
    candidate_pool: all_24_S4
    independent_random_true_candidate_by_subject: true
    same_plan_discovery_confirmatory: true
    batch_size: 25000
    checkpoint_every_batches: 1
  monte_carlo:
    p_value: plus_one_one_sided_greater_equal
    effect: observed_minus_null_median

unrelated_reference:
  enumerate_all_derangements: true
  expected_derangements: 133496
  decision_role: descriptive_only

statistics:
  subject_count: 9
  group_statistic: median
  bootstrap:
    replicates: 20000
    unit: subject
    replacement: true
    statistic: median
    ci_quantiles: [0.025, 0.975]
    quantile_method: linear
    votes_in_decision: false
  influence:
    formula: leave_one_subject_out_statistic_minus_full_statistic
    scope: cached_subject_scores_no_template_refit
    votes_in_decision: false

stages:
  objects: [D, G]
  family_alpha:
    D: 0.025
    G: 0.025
  fixed_sequence: [R, S, P]
  pass_rule:
    discovery_effect_strictly_greater_than: 0.0
    confirmatory_effect_strictly_greater_than: 0.0
    confirmatory_p_less_equal: 0.025
    all_hard_gates_pass: true
  downstream_after_failure: DESCRIPTIVE_ONLY
  reliability:
    discovery: cosine_A_B
    confirmatory: cosine_A_B
    null: label_destruction
  shared:
    discovery: source_A_to_target_B_and_source_B_to_target_A_mean
    confirmatory: fixed_discovery_F_template_to_target_confirmatory_A_B_mean
    null: independent_source_subject_semantic_permutation
  oracle:
    discovery: source_A_template_target_B_and_source_B_template_target_A_candidate_score_mean
    confirmatory: fixed_discovery_F_template_to_target_confirmatory_F
    null: random_true_candidate_rank

decision:
  primary_geometry: AIRM
  terminal:
    both_chains_pass: GO_STRONG
    d_only_pass: GO_METRIC_ONLY
    g_only_pass: STOP_TANGENT_ONLY
    neither_pass: STOP_NO_SHARED_GEOMETRY
    numerical_failure: UNASSESSED_NUMERICAL_FAILURE
    data_failure: UNASSESSED_DATA_CONTRACT_FAILURE
    degenerate_failure: UNASSESSED_DEGENERATE_GEOMETRY
  le_robustness_labels:
    identical_chain_pair: AIRM+LE CONSISTENT
    airm_pass_without_opposite_le_only: AIRM-SPECIFIC
    airm_both_fail_any_le_pass: LE-ONLY — DOES NOT RESCUE AIRM FAILURE
    crossed_pattern: AIRM/LE DISCORDANT

outputs:
  required_root_files:
    - manifest.json
    - git_provenance.json
    - environment.json
    - confirmatory_unlock.json
  required_tables:
    - dataset_contract.csv
    - covariance_sanity.csv
    - airm_mean_convergence.csv
    - le_mean_correctness.csv
    - centering_isometry_gate.csv
    - orthogonal_gauge_gate.csv
    - degenerate_geometry_audit.csv
    - D_shape_vectors.csv
    - G_shape_vectors.csv
    - absolute_geometry_scales.csv
    - radius_angle_summary.csv
    - within_subject_reliability.csv
    - label_destruction_subject_summary.csv
    - label_destruction_group_summary.csv
    - unrelated_subject_derangement_summary.csv
    - loso_templates.csv
    - cross_subject_shared_geometry.csv
    - semantic_permutation_null_summary.csv
    - oracle_permutation_all_24_scores.csv
    - oracle_permutation_subject_summary.csv
    - oracle_permutation_group_summary.csv
    - discovery_confirmatory_comparison.csv
    - airm_le_robustness.csv
    - hypothesis_chain_status.csv
    - subject_bootstrap_summary.csv
    - leave_one_subject_out_influence.csv
  required_objects:
    - airm_marginal_means.npz
    - airm_class_means.npz
    - le_marginal_means.npz
    - le_class_means.npz
    - D_matrices.npz
    - G_matrices.npz
  required_nulls:
    - label_destruction_group_statistics.npz
    - semantic_permutation_group_statistics.npz
    - oracle_rank_null.npz
  decision_file: confirmatory_decision.json
  report_file: report/conditional_geometry_anatomy_v1.md
  report_title: "# BNCI2014_001 Conditional Geometry Anatomy v1"
  figure_stems:
    - figure_1_within_subject_reliability
    - figure_2_reliability_label_null
    - figure_3_same_vs_unrelated
    - figure_4_shared_template_similarity
    - figure_5_D_heatmaps
    - figure_6_G_heatmaps
    - figure_7_oracle_permutation_scores
    - figure_8_oracle_rank_margin
    - figure_9_subject_forest_influence
    - figure_10_airm_le_stage_effects

artifact_policy:
  raw_eeg_tracked: false
  epoch_cache_tracked: false
  covariance_cache_tracked: false
  checkpoint_cache_tracked: false
  compact_required_null_npz_may_be_tracked: true
  max_tracked_file_bytes: 95000000
  discovery_snapshots_immutable_after_unlock: true
