  evaluation_labels_sha256: 7eaf5df6982c58fb45d7053c7da0e0f95e0c65515408ecfbb8cb23a59e5a6b5f

features:
  representation: frozen_session_marginal_centered_tangent_svec
  svec: frobenius_isometric_upper_triangle_row_major
  svec_off_diagonal_scale: 1.4142135623730951
  coordinate_standard_scaler: forbidden
  signature_unit_normalization: forbidden
  deployment_label_storage: sealed_evaluation_only

model:
  name: LRCM
  expansion: Low-Rank Conditional Memory
  rank_grid: [1, 2, 3, 5, 8, 13]
  ridge_lambda_grid: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0, 100.0]
  temperature_grid: [0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0]
  inner_folds: 5
  inner_metric: mean_subject_balanced_accuracy
  tie_breaks: [smallest_rank, largest_ridge_lambda, temperature_closest_to_one]
  solve: symmetric_eigendecomposition_or_solve_no_explicit_inverse
  classifier: PREDICTED_PROTOTYPE_NCM
  class_priors: equal

baselines:
  voting: [POPULATION_ONLY, PAST_PROTOTYPE_DIRECT, IDENTITY_RESIDUAL_CARRY]
  low_rank_audit: [FULL_RIDGE_TRANSFER, ENROLLMENT_PCA_TRANSFER, RANDOM_RANK_MATCHED]
  oracle: [CURRENT_SESSION_KSHOT, CURRENT_SESSION_FULL_ORACLE]
  non_voting: [CLASS_INDEPENDENT_SUBJECT_OFFSET]

inference:
  bootstrap_replicates: 10000
  permutation_replicates: 1999
  null_replicates: 1999
  alpha: 0.05
  confidence: 0.95
  primary_alternative: greater
  holm_family: [IDENTITY_RESIDUAL_CARRY, PAST_PROTOTYPE_DIRECT, POPULATION_ONLY]
  nll_noninferiority_margin: 0.01
  full_ridge_ba_noninferiority_margin: 0.005
  ece_bins: 10
  kshot_budgets_per_class: [1, 2, 4, 8, 16]
  kshot_subsamples: 200
  nulls:
    - ENROLLMENT_SUBJECT_MEMORY_PERMUTATION
    - ENROLLMENT_CLASS_SEMANTICS_PERMUTATION
    - RANDOM_RANK_MATCHED_OUTPUT_SUBSPACE
    - UNPAIRED_SOURCE_SESSION_MAP
  unpaired_null_hyperparameter_rule: conditional_on_observed_source_only_selection
  unpaired_null_justification: exact conditional randomization of longitudinal pairing with all source-only nuisance selections fixed

low_rank_gates:
  maximum_median_rank: 3
  minimum_folds_rank_at_most_3: 4
  full_ridge_noninferiority_margin: 0.005
  require_pca_superiority: true
  require_random_subspace_superiority: true
  require_source_pairing: true

decisions:
  replicated: GO_LOW_RANK_CONDITIONAL_MEMORY_REPLICATED
  stieger_only: GO_STIEGER_ONLY_NEEDS_EXTERNAL_REPLICATION
  map_not_low_rank: GO_CROSS_SESSION_MAP_BUT_LOW_RANK_NOT_SUPPORTED
  stop: STOP_NO_CROSS_SESSION_DOWNSTREAM_UTILITY
  cache_failure: UNASSESSED_REQUIRED_TRIAL_CACHE_MISSING_OR_INVALID
  leakage_failure: UNASSESSED_TARGET_LABEL_LEAKAGE_OR_SPLIT_FAILURE
  numerical_failure: UNASSESSED_NUMERICAL_OR_DATA_CONTRACT_FAILURE
  next_if_go: Can the validated low-rank conditional memory be formulated as a probabilistic mixed-effects adapter with calibrated posterior uncertainty and retain its benefit against full published cross-session and continual-adaptation baselines?
  next_if_stop: Stable low-dimensional subject×class interaction does not provide incremental cross-session decoding utility beyond direct enrollment-session residual transfer under the tested returning-user protocol.

resources:
  workers: 1
  blas_threads: 1
  raw_download_forbidden: true
  raw_rebuild_forbidden: true
  compact_outputs_only: true
