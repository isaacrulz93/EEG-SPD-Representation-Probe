    - [5, 6, 24, 27, 28, 34, 44, 47, 48]
  inner_folds_must_equal_parent: true

preprocessing:
  implementation: src.openbmi_pipeline_v0._prepare_one
  bandpass_hz: [8.0, 30.0]
  filter_family: Butterworth
  filter_order: 5
  filter_phase: zero
  resample_hz: 100.0
  epoch_seconds_half_open: [1.0, 3.5]
  samples_per_trial: 250
  covariance_estimator: oas
  covariance_dtype: float64
  extra_regularization: none
  eigenvalue_clipping: false
  airm_mean_tol: 1.0e-9
  airm_mean_maxiter: 100
  mean_reproduction_relative_tolerance: 2.0e-12

mode:
  rank: 1
  feature_dimension: 210
  svec_order: upper_triangle_row_major
  off_diagonal_scale: sqrt_2
  parent_selected_ranks_required: [1, 1, 1, 1, 1, 1]
  fit: training_only_two_view_cross_covariance_svd
  normalization: frozen_unit_subject_signature
  fold_sign_alignment_for_visualization: paired_views_align_by_session0_dot_with_fold0
  stability_refit: leave_one_training_subject_out
  haar_replicates: 1999
  identity_absolute_cosine_tolerance: 1.0e-10

unlabeled_projection:
  marginal: all_100_pooled_target_trials_airm_mean
  strip_fields: [class_label, event_code, block, run, acquisition_order, semantic_trial_order]
  shuffle_namespace: pooled_unlabeled_trial_order
  evaluation_labels_separate: true
  variance_ddof: 0

bridge:
  primary_association: spearman
  aggregate_gate_statistic: minimum_session_spearman
  null_replicates: 1999
  subject_permutation_namespace: bridge_subject_permutation
  random_direction_namespace: bridge_haar_random_direction
  alpha: 0.05
  normalized_absolute_error_denominator: mean_absolute_beta
  leave_one_subject_requires_both_session_signs: true

unsigned_recovery:
  primary_estimator: SOURCE_WITHIN_CORRECTED_PROJECTED_VARIANCE
  primary_target: V_between
  secondary_estimators:
    - TOTAL_PROJECTED_VARIANCE
    - SYMMETRIC_TWO_COMPONENT_MIXTURE
    - UNORDERED_TWO_MEANS_SEPARATION
  source_within_aggregation: arithmetic_mean_across_outer_training_subjects
  nonnegative_truncation: max_zero
  primary_association: spearman
  null_replicates: 1999
  subject_permutation_namespace: unsigned_subject_target_permutation
  random_direction_namespace: unsigned_haar_random_direction
  shuffled_within_namespace: shuffled_source_within_model
  bootstrap_replicates: 10000
  bootstrap_namespace: unsigned_subject_bootstrap
  confidence: 0.95
  mixture:
    equal_weights: true
    shared_variance: true
    component_order_identified: false
    deterministic_initial_separation_quantiles: [0.15, 0.25, 0.35, 0.5, 0.65, 0.75, 0.85]
    maximum_iterations: 500
    convergence_tolerance: 1.0e-10
  unordered_two_means:
    maximum_iterations: 500
    convergence_tolerance: 1.0e-12
  descriptive_controls:
    same_session_pca: first_training_session_principal_direction
    overall_covariance_magnitude: log_frobenius_norm_of_subject_session_airm_marginal
    total_tangent_space_variance: sum_coordinate_population_variances
    shuffled_source_within_model: cyclic_outer_fold_shift_plus_one_within_session
    trial_count: exact_constant_100
    acquisition_order_verification: reverse_projected_trial_order

symmetry:
  tolerance: 2.0e-12
  signed_zero_label_status: NONIDENTIFIABLE_UP_TO_CLASS_PERMUTATION
  failure_status: UNASSESSED_LABEL_LEAKAGE_OR_SYMMETRY_FAILURE

minimal_anchor:
  budgets: [0, 2, 4, 8, 16, 32]
  eligible_efficiency_budgets: [2, 4, 8]
  calibration_subsamples: 200
  stratified_equal_per_class: true
  proposed: all_unlabeled_sqrt_between_energy_plus_m_label_orientation
  equal_label_baseline: direct_m_label_class_contrast
  source_baseline: training_population_mean_absolute_beta_plus_m_label_orientation
  signed_target: beta
  null_replicates: 1999
  paired_permutation_namespace: anchor_paired_sign_flip
  bootstrap_replicates: 10000
  bootstrap_namespace: anchor_subject_bootstrap
  confidence: 0.95
  alpha: 0.05
  selection: smallest_eligible_budget_passing_all_gates

decisions:
  signed:
    pass: NONIDENTIFIABLE_UP_TO_CLASS_PERMUTATION
    failure: UNASSESSED_SYMMETRY_CONTRACT_FAILURE
  bridge:
    pass: TRIAL_TO_PROTOTYPE_MODE_COMPATIBLE
    failure: UNASSESSED_TRIAL_TO_PROTOTYPE_MODE_INCOMPATIBILITY
  unsigned:
    pass: UNSIGNED_CONDITIONAL_ENERGY_RECOVERY_SUPPORTED
    negative: UNSIGNED_CONDITIONAL_ENERGY_RECOVERY_NOT_SUPPORTED
  anchor:
    pass: MINIMAL_SEMANTIC_ANCHOR_EFFICIENT
    negative: MINIMAL_SEMANTIC_ANCHOR_NOT_EFFICIENT
  trial_object_failure: UNASSESSED_TRIAL_LEVEL_OBJECT_INSUFFICIENT
  numerical_failure: UNASSESSED_NUMERICAL_OR_DATA_CONTRACT_FAILURE
  next_question_if_supported: Can unsigned conditional-energy recovery and minimal semantic anchoring prospectively replicate across repeated sessions in an unseen multiclass dataset under a pre-frozen class-permutation protocol?
  next_question_otherwise: What additional structural assumption or semantic target supervision is required when pooled unlabeled dispersion does not recover the stable conditional mode efficiently?

forbidden_datasets: [BNCI2014_001, Stieger2021, HGD, Rogala_ASD, Sheffield_ASD, faces_chairs_ASD]
forbidden_methods: [downstream_classification, domain_adaptation, TTA, pseudo_labeling, neural_networks, new_losses]

resources:
  workers: 1
  blas_threads: 1
  source_hash_checkpoint_each_file: true
  trial_cache_committed: false
  peak_rss_gib_budget: 4.0
  wall_clock_hours_budget: 6.0
