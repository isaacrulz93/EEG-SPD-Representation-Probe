hard_gates:
  reproduction_absolute_tolerance: 1.0e-12
  reproduction_relative_tolerance: 0.0
  symmetry_relative_error_max: 1.0e-12
  condition_number_max: 1.0e12
  distance_symmetry_absolute_error_max: 1.0e-10
  distance_diagonal_absolute_error_max: 1.0e-12
  distance_negative_tolerance: 1.0e-12
  triangle_absolute_tolerance: 1.0e-10
  triangle_relative_tolerance: 1.0e-10
  bag_invariance_absolute_error_max: 1.0e-12
  normalized_karcher_residual_max: 1.0e-7
  airm_mean_tol: 1.0e-9
  airm_mean_maxiter: 100

classifier:
  scaler: StandardScaler
  scaler_fit_scope: train_only
  with_mean: true
  with_std: true
  classifier: multinomial_logistic_regression
  c: 1.0
  solver: lbfgs
  max_iter: 5000
  tol: 1.0e-4
  class_weight: null
  random_state: 20260809
  tuning: false
  primary_metric: balanced_accuracy
  secondary_metrics: [accuracy, macro_f1, per_class_recall]
  chance: 0.25

stage_w:
  question: within_subject_within_session_class_decoding
  half_a_runs: [0, 1, 2]
  half_b_runs: [3, 4, 5]
  directions: [A_TO_B, B_TO_A]
  subject_statistic: mean_across_sessions_and_directions
  group_statistic: median_subject

stage_x:
  question: same_subject_cross_session_class_transfer
  directions: [0train_TO_1test, 1test_TO_0train]
  subject_statistic: mean_across_directions
  group_statistic: median_subject
  inferential_prerequisite: PATH_STAGE_W_PASS

nulls:
  master_seed: 20260810
  label_destruction:
    replicates: 1999
    stream_tag_hex: "0x4C4142454C5758"
    seed_derivation: "SeedSequence([master_seed,stream_tag]).spawn(replicates); child uint64[0]"
    grouping: subject_x_session_x_run
    group_order: subject_then_session_config_order_then_numeric_run
    trial_order: global_sample_index
    shared_representations: [PATH_D10, BAG_CANON_D10]
    shared_stages: [W, X]
  order_shuffle:
    replicates: 1999
    stream_tag_hex: "0x4F52444552"
    seed_derivation: "SeedSequence([master_seed,stream_tag]).spawn(replicates); child uint64[0]"
    permutations: S5_lexicographic_nonidentity_uniform
    trial_order: global_sample_index
    stage: X
    representation: PATH_D10
    prerequisite: PATH_STAGE_W_AND_X_PASS
  monte_carlo:
    statistic: median_subject_balanced_accuracy
    sidedness: greater_or_equal
    plus_one: true
    alpha: 0.05
    pass_rule: effect_gt_zero_and_p_lte_alpha

decisions:
  reproduction_failure: UNASSESSED_TRAJECTORY_REPRODUCTION_FAILURE
  technical_failure: UNASSESSED_TECHNICAL_FAILURE
  stage_w_fail: STOP_WITHIN_SUBJECT_TRAJECTORY_CLASS_POOR
  stage_x_fail: STOP_SESSION_SPECIFIC_TRAJECTORY_ONLY
  stage_o_fail: GO_STABLE_SUBJECT_SPECIFIC_LOCAL_GEOMETRY
  all_pass: GO_STABLE_SUBJECT_SPECIFIC_ORDERED_TRAJECTORY_COMPONENT
  order_not_run: NOT_RUN_PREREQUISITE

