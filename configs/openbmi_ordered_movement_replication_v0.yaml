  subjects: 54
  sessions: [0, 1]
  source_sessions: [1, 2]
  phase: 1train
  classes: [left_hand, right_hand]
  trials_per_cell: 50
  split_trials_per_cell: 25
  channels: [FC5, FC3, FC1, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6]
  acquisition_sampling_hz: 1000.0
  analysis_sampling_hz: 100.0
  bandpass_hz: [8.0, 30.0]
  filter: {family: Butterworth, order: 5, phase: zero, method: iir, output: sos}
  processing_order: bandpass_continuous_then_resample_then_epoch
  epoch_seconds: [1.0, 3.5]
  epoch_interval: half_open
  baseline: null
  covariance: {estimator: oas, dtype: float64, symmetrize: true, clipping: false}
