input:
  full_artifact: outputs/bnci2014_001_local_temporal_sequence_v0/arrays/ordered_mean_sequences.npz
  full_sha256: e03b94daef3eb37f9209ee7a7482ea575b1eb353804505a3e91013339da1913f
  full_shape: [2, 9, 4, 5, 22, 22]
  split_artifact: outputs/bnci2014_001_local_temporal_sequence_v0/arrays/split_half_mean_sequences.npz
  split_sha256: 355f098de7ff3dcf274e5a62cf6d92022bc1b1f6ed4301a2dc53f9a19f3cd868
  split_shape: [2, 2, 9, 4, 5, 22, 22]
  subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  sessions: [0train, 1test]
  classes: [left_hand, right_hand, feet, tongue]
  temporal_positions: [1, 2, 3, 4, 5]
  full_sequence_count: 72
  split_sequence_count: 144
  full_mean_matrix_count: 360
  split_mean_matrix_count: 720
  reproduction: exact_npz_arrays_against_scientific_result_commit
  failure: UNASSESSED_TECHNICAL_FAILURE

movement:
  delta_t_seconds: 0.8
  steps: 4
  transition_identity: fixed
  tangent_displacement: exact_AIRM_Log_divided_by_Delta_t
  local_crosscheck: symmetric_whitened_log_U_only
  path_transport: ordered_reverse_piecewise_geodesic_prefix
  independent_radial_transport_to_M1: forbidden
  identity_coordinate: symmetric_whitening_at_M1
  representation: ordered_discrete_AIRM_antidevelopment

geometry_gates:
  dimension: 22
  symmetry_relative_tolerance: 1.0e-10
  norm_absolute_tolerance: 1.0e-8
  transport_relative_tolerance: 1.0e-8
  common_congruence_relative_tolerance: 1.0e-8
  one_common_O_required_for_all_steps: true
  failure: UNASSESSED_MOVEMENT_GEOMETRY_NUMERICAL_FAILURE

quotient:
  objective: mean_four_Frobenius_squared_common_orthogonal_conjugation
  same_Q_all_steps: true
  transition_permutation: forbidden
  dtw: forbidden
  canonical_pair_hash_ordering: true
  q_interpretation: nuisance_only

optimizer:
  library: pymanopt_2.2.1_TrustRegions
  manifold: square_Stiefel_O_d
  retraction: polar
  objective: exact_new_Frobenius_tangent_conjugation_loss
  gradient: exact_analytic_ambient
  hessian: exact_analytic_ambient
  total_starts: 6
  starts: [spectral, spectral_reflection, spectral_perturbed, spectral_perturbed_reflection, deterministic_haar, deterministic_haar_reflection]
  determinant_coverage: three_per_component
  max_iterations: 250
  gradient_tolerance: 1.0e-6
  min_step_size: 1.0e-12
  max_time_seconds: 120.0
  max_cost_evaluations: 5000
  trust_miniter: 3
  trust_kappa: 0.1
  trust_theta: 1.0
  trust_rho_prime: 0.1
  trust_use_rand: false
  trust_rho_regularization: 1000.0
  max_inner_iterations: 30
  known_q_zero_tolerance: 1.0e-8
  action_recovery_relative_tolerance: 1.0e-8
  multistart_spectral_objective_tolerance: 1.0e-8
  gradient_fd_absolute_tolerance: 2.0e-6
  gradient_fd_relative_tolerance: 2.0e-5
  require_converged_candidate_both_determinants_every_fit: true
  parallel_workers: 4
  failure: UNASSESSED_MOVEMENT_QUOTIENT_NUMERICAL_FAILURE

statistics:
  a_sc: same_subject_same_class_distance
  b_sc: same_subject_different_class_mean_distance
  c_sc: different_subject_same_class_mean_distance
  d_sc: different_subject_different_class_mean_distance
  S_sc: c_sc_minus_a_sc
  C_sc: b_sc_minus_a_sc
  J_sc: b_sc_plus_c_sc_minus_a_sc_minus_d_sc
  group_unit: subject

nulls:
  master_seed: 20260810
  replicates: 1999
  alpha: 0.05
  pvalue: one_sided_greater_or_equal_plus_one
  recompute_geometry_or_distance_inside_draw: false
  subjectbreak:
    stream_tag: 1102
    operation: permute_session1_subject_whole_tuples_within_class
  classbreak:
    stream_tag: 1101
    operation: permute_session1_class_whole_tuples_within_subject

controls:
  magnitude_only:
    name: d_len
    ordered_steps_fixed: true
    definition: root_mean_four_squared_speed_differences
    primary_terminal_effect: none
  direct:
    name: d_direct
    definition: root_mean_four_squared_unquotiented_Z_differences
    interpretation: montage_registered_common_frame_only
    primary_terminal_effect: none

split_half:
  half_A_runs: [0, 2, 4]
  half_B_runs: [1, 3, 5]
  independent_antidevelopment: true
  reliability_distance: d_mov
  distance_count: 72
  gating: false
  posthoc_threshold: forbidden

visualization:
  vectorization: Frobenius_isometric_svec
  pca_basis: one_global_full_SVD_over_72_times_4_Z_matrices
  components: 2
  fixed_cells:
    - [1, left_hand]
    - [1, feet]
    - [2, left_hand]
    - [2, feet]
  inference_space: full_Sym22_power4_quotient

terminal:
  full: GO_REPRODUCIBLE_SUBJECT_CLASS_ORDERED_MOVEMENT
  specificity_without_interaction: GO_REPRODUCIBLE_ORDERED_MOVEMENT_WITHOUT_INTERACTION
  stop: STOP_NO_REPRODUCIBLE_ORDERED_MOVEMENT_V0
  geometry_failure: UNASSESSED_MOVEMENT_GEOMETRY_NUMERICAL_FAILURE
  quotient_failure: UNASSESSED_MOVEMENT_QUOTIENT_NUMERICAL_FAILURE
  technical_failure: UNASSESSED_TECHNICAL_FAILURE

claim_restrictions:
  - no_individual_trial_neural_velocity
  - no_continuous_time_dynamics
  - no_causal_or_stable_physiological_transition
  - no_source_space_dynamics
  - no_physical_sensor_orientation
  - no_absolute_subject_pose
  - no_biological_privilege_of_AIRM
  - no_completeness_of_five_windows
  - no_unique_direction_contribution_from_significance_comparison
