  maximum_absolute_tolerance: 1.0e-12
  failure: UNASSESSED_TECHNICAL_FAILURE_REPRODUCTION

mean_sequences:
  local_centering: false
  mean: AIRM_Frechet
  implementation: pyriemann_mean_riemann
  init: null
  tolerance: 1.0e-9
  max_iterations: 100
  warning_allowed: false
  normalized_karcher_residual_max: 1.0e-7
  ordered_sequence_count: 72
  temporal_positions: [1, 2, 3, 4, 5]
  point_permutation_during_averaging: false

split_half:
  half_A_runs: [0, 2, 4]
  half_B_runs: [1, 3, 5]
  trials_per_half_cell: 36
  save_same_position_distances: true
  save_cross_position_5x5: true
  gating: false
  posthoc_threshold: forbidden

matching:
  cross_time_matrix_shape: [36, 36, 5, 5]
  all_permutations: 120
  permutation_order: python_itertools_lexicographic
  permutation_convention: row_i_to_column_pi_i
  derangements: 44
  derangement_condition: pi_i_not_equal_i_for_every_i
  D_id: root_mean_five_diagonal_squared_distances
  gain: median_44_derangement_costs_minus_D_id
  relative_gain: descriptive_only
  identity_rank: one_plus_number_of_strictly_lower_all_120_costs
  identity_rank_primary: false

nulls:
  master_seed: 20260810
  replicates: 1999
  pvalue: one_sided_greater_or_equal_plus_one
  alpha: 0.05
  temporal:
    stream_tag: 1201
    operation: independent_uniform_S5_temporal_relabel_per_session1_cell
  subjectbreak:
    stream_tag: 1102
    operation: permute_session1_subject_sequences_within_class
    exact_prior_stream_reused: true
  classbreak:
    stream_tag: 1101
    operation: permute_session1_class_sequences_within_subject
    exact_prior_stream_reused: true

statistics:
  A_sc: same_subject_same_class_G
  T_temporal: mean_subject_of_mean_class_A_sc
  S_sc: same_cell_G_minus_different_subject_same_class_mean_G
  T_subject: mean_subject_of_mean_class_S_sc
  C_sc: same_cell_G_minus_same_subject_different_class_mean_G
  T_class: mean_subject_of_mean_class_C_sc
  J_sc: a_sc_minus_b_sc_minus_c_sc_plus_d_sc
  T_J: mean_subject_of_mean_class_J_sc
  group_unit: subject
  secondary_interaction_requires_both_nulls: true

visualization:
  global_reference: AIRM_mean_all_360_cell_window_means
  tangent_coordinate: whitened_AIRM_log
  vectorization: Frobenius_isometric_svec
  pca_basis: one_global_sklearn_full_SVD_basis
  components: 2
  fixed_cells:
    - [1, left_hand]
    - [1, feet]
    - [2, left_hand]
    - [2, feet]
  subject_small_multiples: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  group_K_categories:
    - same_subject_same_class
    - different_subject_same_class
    - same_subject_different_class
    - different_subject_different_class
  scientific_space: AIRM_not_PCA

terminal:
  full_specificity: GO_REPRODUCIBLE_SUBJECT_CLASS_TEMPORAL_SEQUENCE
  partial_specificity: GO_SHARED_TEMPORAL_SEQUENCE_WITH_PARTIAL_SPECIFICITY
  shared_only: GO_SHARED_TEMPORAL_SEQUENCE_ONLY
  no_temporal: STOP_NO_REPRODUCIBLE_TEMPORAL_SEQUENCE_V0
  numerical_failure: UNASSESSED_NUMERICAL_FAILURE
  technical_failure: UNASSESSED_TECHNICAL_FAILURE
  reproduction_failure: UNASSESSED_TECHNICAL_FAILURE_REPRODUCTION

claim_restrictions:
  - no_continuous_physiological_trajectory
  - no_causal_temporal_dynamics
  - no_subject_specific_pose
  - no_mean_shape_or_GPA_consensus
  - no_neural_state_sequence
